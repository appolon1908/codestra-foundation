services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: foundation
      POSTGRES_USER: foundation
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - foundation-postgres:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundation -d foundation"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      FOUNDATION_ENVIRONMENT: production
      FOUNDATION_DATABASE_URL: postgresql+psycopg://foundation:{password}@postgres:5432/foundation
      FOUNDATION_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      FOUNDATION_MUTATIONS_ENABLED: "false"
      FOUNDATION_AUTO_CREATE_SCHEMA: "false"
      FOUNDATION_JWT_ISSUER: https://auth.codestra.co/realms/codestra
      FOUNDATION_JWT_AUDIENCE: codestra-foundation-api
      FOUNDATION_JWT_ALGORITHM: RS256
      FOUNDATION_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      FOUNDATION_FIELD_ENCRYPTION_KEY_FILE: /run/secrets/field_encryption_key
      FOUNDATION_IDENTITY_HASH_KEY_FILE: /run/secrets/identity_hash_key
    secrets:
      - postgres_password
      - jwt_public_key
      - field_encryption_key
      - identity_hash_key
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:18100:8000"
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      FOUNDATION_ENVIRONMENT: production
      FOUNDATION_DATABASE_URL: postgresql+psycopg://foundation:{password}@postgres:5432/foundation
      FOUNDATION_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"

  outbox-worker:
    build: .
    command: ["python", "-m", "app.outbox_worker"]
    environment:
      FOUNDATION_ENVIRONMENT: production
      FOUNDATION_DATABASE_URL: postgresql+psycopg://foundation:{password}@postgres:5432/foundation
      FOUNDATION_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      FOUNDATION_OUTBOX_ENABLED: "false"
      FOUNDATION_MIDDLEWARE_EVENT_URL: https://middleware.internal.example/v1/events
      FOUNDATION_MIDDLEWARE_ACCESS_TOKEN_FILE: /run/secrets/middleware_access_token
      FOUNDATION_MIDDLEWARE_CA_FILE: /run/secrets/middleware_ca
      FOUNDATION_MIDDLEWARE_CLIENT_CERT_FILE: /run/secrets/middleware_client_cert
      FOUNDATION_MIDDLEWARE_CLIENT_KEY_FILE: /run/secrets/middleware_client_key
    secrets:
      - postgres_password
      - middleware_access_token
      - middleware_ca
      - middleware_client_cert
      - middleware_client_key
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

networks:
  backend:
    internal: true

volumes:
  foundation-postgres:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  jwt_public_key:
    file: ./secrets/jwt_public_key.pem
  field_encryption_key:
    file: ./secrets/field_encryption_key
  identity_hash_key:
    file: ./secrets/identity_hash_key
  middleware_access_token:
    file: ./secrets/middleware_access_token
  middleware_ca:
    file: ./secrets/middleware_ca.pem
  middleware_client_cert:
    file: ./secrets/middleware_client_cert.pem
  middleware_client_key:
    file: ./secrets/middleware_client_key.pem
